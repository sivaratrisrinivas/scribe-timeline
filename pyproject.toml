[project]
name = "scribe-timeline"
version = "0.1.0"
description = "Reproducible diagnostic for Scribe Realtime VAD word-timestamp offsets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "elevenlabs>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scribe_timeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `make check` promises no network, so the default run excludes tests that need one.
#
# An `addopts` default rather than a flag on the make targets, because the promise has to
# hold for a bare `pytest` too — otherwise the offline claim would depend on remembering
# to pass a switch. `make check-live` passes `-m live`, which overrides this.
addopts = "-m 'not live'"
markers = [
  "live: reaches the network; excluded from the offline gate, run by `make check-live`",
]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
